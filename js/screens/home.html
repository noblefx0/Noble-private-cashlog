<section id="homeScreen" class="screen active">
    <h2 class="screen-heading">Today's overview</h2>
    <div class="home-balance-grid">
        <div class="stat"><div class="label">Cash balance today</div><div id="homeCashBalance" class="value">₦0</div></div>
        <div class="stat"><div class="label">Bank balance today</div><div id="homeTransferBalance" class="value">₦0</div></div>
    </div>
    <div class="stat total home-total" style="margin-top:12px"><div class="label">Total received today</div><div id="homeTotalBalance" class="value">₦0</div></div>
    <div class="card home-quick-actions">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">Quick actions</h2></div>
        <div class="row" style="margin-top:12px">
            <button class="btn" type="button" data-go="incomeScreen">+ Add income</button>
            <button class="btn secondary" type="button" data-go="transferScreen">⇄ Move money</button>
            <button class="btn secondary" type="button" data-go="removedScreen">− Remove money</button>
        </div>
    </div>
</section>
